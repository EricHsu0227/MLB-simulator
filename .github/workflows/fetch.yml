name: Fetch 2026 data
on:
  push:
    branches: [data-2026]
    paths: [fetch_parkgames.py, .github/workflows/fetch.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: python3 fetch_parkgames.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data
          git commit -m "2026 data snapshot" || echo nothing
          git push
