name: Fetch season data
on:
  push:
    branches: [data-2026]
    paths: [fetch_season.py, .github/workflows/fetch.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  season:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        year: [2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
    steps:
      - uses: actions/checkout@v4
      - run: python3 fetch_season.py ${{ matrix.year }}
      - uses: actions/upload-artifact@v4
        with:
          name: season-${{ matrix.year }}
          path: season_${{ matrix.year }}.tar.gz
          retention-days: 7
